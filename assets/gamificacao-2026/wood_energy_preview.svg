<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bgWood)"/>

  <!-- Silhueta de Floresta ao Fundo -->
  <polygon points="0,250 80,170 170,250" fill="#042f2e" opacity="0.6"/>
  <polygon points="120,250 220,150 330,250" fill="#064e3b" opacity="0.7"/>
  <polygon points="280,250 380,160 480,250" fill="#042f2e" opacity="0.6"/>
  <polygon points="420,250 510,180 600,250" fill="#064e3b" opacity="0.5"/>

  <!-- Terreno Gramado / Industrial -->
  <rect x="0" y="235" width="600" height="115" fill="#1e293b"/>
  <line x1="0" y1="235" x2="600" y2="235" stroke="#10b981" stroke-width="4"/>

  <!-- Usina de Biomassa e Energia Limpa -->
  <rect x="60" y="145" width="110" height="90" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <polygon points="50,145 115,100 180,145" fill="#475569"/>
  <!-- Chaminé com vapor eco -->
  <rect x="140" y="70" width="20" height="75" fill="#64748b"/>
  <circle cx="150" cy="55" r="12" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="158" cy="35" r="18" fill="#e2e8f0" opacity="0.3"/>
  <circle cx="168" cy="18" r="22" fill="#e2e8f0" opacity="0.15"/>

  <!-- Árvores em vetor moderno -->
  <rect x="235" y="195" width="14" height="40" fill="#78350f"/>
  <polygon points="242,125 210,180 274,180" fill="url(#leafGrad)"/>
  <polygon points="242,155 215,200 269,200" fill="url(#leafGrad)"/>

  <rect x="285" y="205" width="10" height="30" fill="#78350f"/>
  <polygon points="290,150 265,195 315,195" fill="url(#leafGrad)"/>

  <!-- Gerador / Turbina e Linhas de Transmissão -->
  <rect x="350" y="175" width="70" height="60" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="385" cy="205" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <path d="M385 190 L385 220 M370 205 L400 205" stroke="#38bdf8" stroke-width="2"/>

  <!-- Emblema de Eficiência Energética -->
  <circle cx="490" cy="130" r="50" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="3"/>
  <!-- Raio Elétrico -->
  <path d="M495 95 L470 135 L490 135 L485 165 L515 125 L495 125 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>

  <!-- Badge Unity 3D -->
  <rect x="40" y="25" width="115" height="30" rx="15" fill="#090d16" stroke="#ffffff" stroke-width="1"/>
  <text x="97" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">UNITY 3D</text>

  <!-- Título do Jogo -->
  <text x="300" y="295" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="2">WOOD ENERGY TYCOON</text>
  <text x="300" y="320" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">GESTÃO DE BIOMASSA, SILVICULTURA E ENERGIA</text>
</svg>
